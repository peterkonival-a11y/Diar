<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diár</title>
  <meta name="theme-color" content="#e09aaa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Diár">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- OneSignal (push aj pri zatvorenej appke) – nastav APP ID nižšie v scripte -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    :root {
      --bg: #f8eef1;
      --text: #5c3d48;
      --muted: #a07a88;
      --accent: #e09aaa;
      --accent-deep: #c97a8c;
      --glass: rgba(255, 248, 250, 0.42);
      --glass-strong: rgba(255, 250, 252, 0.68);
      --glass-border: rgba(255, 255, 255, 0.58);
      --shadow: 0 10px 40px rgba(160, 90, 110, 0.14);
      --radius: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #fdf4f7 0%, #f5e6ec 45%, #ebe0f0 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: calc(80px + var(--safe-bottom));
    }

    /* Liquid blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.48;
      pointer-events: none;
      z-index: 0;
      animation: liquid 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 420px; height: 420px; background: #f0b8c8; top: -120px; left: -100px; }
    .blob-2 { width: 360px; height: 360px; background: #d8b8e8; bottom: -80px; right: -70px; animation-delay: -6s; }
    .blob-3 { width: 260px; height: 260px; background: #e8c8d8; top: 45%; left: 40%; opacity: 0.32; animation-delay: -12s; }
    @keyframes liquid {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(25px,-18px) scale(1.07); }
      100% { transform: translate(-18px,12px) scale(0.96); }
    }

    /* Floating hearts background */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      color: rgba(224, 154, 170, 0.22);
      font-size: 1.2rem;
      animation: floatHeart linear infinite;
      user-select: none;
    }
    .heart.soft { color: rgba(200, 140, 180, 0.18); }
    .heart.tiny { font-size: 0.75rem; opacity: 0.7; }
    .heart.big { font-size: 1.8rem; opacity: 0.55; }
    @keyframes floatHeart {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-100vh) rotate(25deg) scale(1.1); opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 14px 20px;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #c97a8c 0%, #b88ac0 60%, #d494a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .clover {
      display: inline-block;
      width: 1.35em;
      height: 1.35em;
      position: relative;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(120, 170, 130, 0.25));
    }
    .clover span {
      position: absolute;
      width: 0.55em;
      height: 0.55em;
      background: linear-gradient(145deg, #b8e0c0 0%, #8ecf9a 50%, #7ec090 100%);
      border-radius: 50% 50% 50% 0;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.5);
    }
    .clover span:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%) rotate(-45deg); }
    .clover span:nth-child(2) { top: 50%; right: 0; transform: translateY(-50%) rotate(45deg); }
    .clover span:nth-child(3) { bottom: 0; left: 50%; transform: translateX(-50%) rotate(135deg); }
    .clover span:nth-child(4) { top: 50%; left: 0; transform: translateY(-50%) rotate(-135deg); }
    .clover::after {
      content: '';
      position: absolute;
      bottom: -0.15em;
      left: 50%;
      width: 0.12em;
      height: 0.4em;
      background: linear-gradient(180deg, #7ec090, #6ab080);
      border-radius: 2px;
      transform: translateX(-50%);
    }

    .view-switcher {
      display: flex;
      gap: 4px;
      background: var(--glass);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
    }
    .view-btn {
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      color: var(--muted);
      transition: all 0.22s ease;
      white-space: nowrap;
    }
    .view-btn.active {
      background: linear-gradient(135deg, #e09aaa, #d08098);
      color: #fff;
      box-shadow: 0 3px 14px rgba(200, 120, 140, 0.4);
    }

    /* ===== LAYOUT ===== */
    .main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 820px) {
      .main { grid-template-columns: 260px 1fr; gap: 18px; }
      body { padding-bottom: 30px; }
      .app { padding: 24px 18px 40px; }
      h1 { font-size: 1.9rem; }
      .view-btn { padding: 9px 16px; font-size: 0.88rem; }
      .fab { display: none !important; }
      .mobile-nav { display: none !important; }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* On mobile: categories as horizontal scroll chips */
    .categories-mobile {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .categories-mobile::-webkit-scrollbar { display: none; }

    .cat-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 50px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(160,90,110,0.08);
      white-space: nowrap;
    }
    .cat-chip:active { transform: scale(0.96); }
    .cat-chip .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
    }

    @media (min-width: 820px) {
      .categories-mobile { display: none; }
      .sidebar-desktop { display: flex !important; }
    }
    .sidebar-desktop { display: none; flex-direction: column; gap: 14px; }

    /* Liquid Glass card */
    .card {
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.55);
      position: relative;
      overflow: hidden;
    }
    @media (min-width: 820px) { .card { padding: 20px; } }

    .card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.22s ease;
      min-height: 44px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e09aaa, #d08098);
      color: #fff;
      box-shadow: 0 5px 18px rgba(200, 120, 140, 0.35);
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-secondary {
      background: var(--glass-strong);
      color: var(--text);
      border: 1px solid var(--glass-border);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      min-height: 40px;
    }
    .btn-ghost:active { background: rgba(255,255,255,0.5); }
    .btn-back {
      background: var(--glass-strong);
      color: var(--text);
      border: 1px solid var(--glass-border);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      min-height: 44px;
    }

    /* ===== CATEGORIES DESKTOP ===== */
    .category-list { display: flex; flex-direction: column; gap: 4px; }
    .category-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      min-height: 44px;
    }
    .category-item:hover, .category-item:active {
      background: rgba(255,255,255,0.55);
    }
    .cat-color {
      width: 13px; height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
    }
    .cat-name { flex: 1; font-size: 0.92rem; }

    /* ===== FORMS ===== */
    input, select, textarea {
      padding: 13px 14px;
      border: 1px solid rgba(200, 120, 140, 0.18);
      border-radius: 14px;
      font-size: 16px; /* prevents iOS zoom */
      background: rgba(255,255,255,0.55);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
      width: 100%;
      backdrop-filter: blur(10px);
      min-height: 46px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 0 3px rgba(224, 154, 170, 0.22);
    }
    textarea { min-height: 70px; resize: vertical; }

    .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-option {
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .color-option.selected {
      border-color: var(--text);
      transform: scale(1.12);
    }

    /* ===== CALENDAR ===== */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .calendar-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    @media (min-width: 820px) {
      .calendar-header h2 { font-size: 1.22rem; }
    }
    .nav-btns { display: flex; gap: 4px; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    @media (min-width: 500px) { .calendar-grid { gap: 5px; } }

    .day-name {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    @media (min-width: 500px) { .day-name { font-size: 0.75rem; } }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      padding: 3px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: rgba(255,255,255,0.28);
      border: 1px solid transparent;
      min-height: 40px;
    }
    @media (min-width: 500px) {
      .day-cell { border-radius: 14px; padding: 5px; min-height: 48px; }
    }
    .day-cell:active {
      background: rgba(255,255,255,0.55);
    }
    .day-cell.other-month { opacity: 0.25; }
    .day-cell.today {
      background: rgba(180, 210, 230, 0.5);
      border-color: #a0c0d8;
      font-weight: 700;
    }
    .day-cell.selected {
      background: linear-gradient(135deg, #e09aaa, #d08098);
      color: #fff;
      box-shadow: 0 3px 12px rgba(200, 120, 140, 0.35);
    }
    .day-number { font-size: 0.82rem; margin-top: 2px; }
    @media (min-width: 500px) { .day-number { font-size: 0.9rem; } }

    .day-dots {
      display: flex; gap: 2px; margin-top: 2px;
      flex-wrap: wrap; justify-content: center;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.45);
    }

    /* ===== WEEK ===== */
    .week-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    @media (min-width: 700px) {
      .week-grid { grid-template-columns: repeat(7, 1fr); gap: 8px; }
    }
    .week-day {
      background: rgba(255,255,255,0.3);
      border-radius: 16px;
      padding: 12px;
      min-height: auto;
      border: 1px solid var(--glass-border);
    }
    @media (min-width: 700px) { .week-day { min-height: 150px; } }
    .week-day.today {
      background: rgba(180, 210, 230, 0.38);
      border-color: #a0c0d8;
    }
    .week-day-header {
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .week-task {
      background: rgba(255,255,255,0.65);
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 0.88rem;
      border-left: 4px solid;
      cursor: pointer;
      min-height: 42px;
      display: flex;
      align-items: center;
    }
    .week-task:active { opacity: 0.85; }
    .week-task.done { opacity: 0.45; text-decoration: line-through; }

    /* ===== TASK LIST ===== */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      background: rgba(255,255,255,0.42);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-left: 5px solid;
      transition: all 0.18s;
      border: 1px solid transparent;
      border-left-width: 5px;
      min-height: 56px;
    }
    .task-item:active {
      background: rgba(255,255,255,0.65);
    }
    .task-item.done { opacity: 0.48; }
    .task-item.done .task-title { text-decoration: line-through; }

    .task-check {
      width: 26px; height: 26px;
      border-radius: 8px;
      border: 2px solid var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.2s;
    }
    .task-item.done .task-check {
      background: #c8e0d0;
      border-color: #98c0a8;
      color: #4a7a5a;
    }
    .task-content { flex: 1; cursor: pointer; min-width: 0; }
    .task-title {
      font-weight: 600;
      margin-bottom: 2px;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .task-meta { font-size: 0.78rem; color: var(--muted); }
    .task-actions { display: flex; gap: 2px; flex-shrink: 0; }

    /* ===== DAY DETAIL ===== */
    .day-detail {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(200, 120, 140, 0.15);
    }
    .day-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .day-detail-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .day-detail-meniny {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-detail-meniny .meniny-icon {
      font-size: 1rem;
    }

    /* ===== NOTES ===== */
    .notes-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .notes-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .note-block {
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(200, 120, 140, 0.15);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .note-block-header {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .note-block-header input {
      flex: 1;
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      padding: 6px 4px;
      outline: none;
      font-family: inherit;
    }
    .note-block-header input::placeholder { color: var(--muted); }
    .note-block textarea {
      width: 100%;
      min-height: 120px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      resize: vertical;
      font-family: inherit;
      outline: none;
    }
    .note-block textarea::placeholder { color: var(--muted); opacity: 0.7; }
    .note-block-del {
      border: none;
      background: transparent;
      color: #c06070;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      min-height: 36px;
    }
    .note-block-del:hover { background: rgba(200,100,120,0.1); }

    /* ===== CATEGORY PAGE ===== */
    .category-page { display: none; }
    .category-page.active { display: block; }

    .category-page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .category-page-title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .category-page-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.5);
      flex-shrink: 0;
    }
    .category-stats {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 50, 65, 0.3);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 0;
    }
    @media (min-width: 520px) {
      .modal-overlay {
        align-items: center;
        padding: 18px;
      }
    }
    .modal-overlay.open { display: flex; }

    /* Visual reminder alert */
    .reminder-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 50, 65, 0.45);
      backdrop-filter: blur(8px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .reminder-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .reminder-card {
      background: rgba(255, 248, 250, 0.96);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(140, 80, 100, 0.3);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.35s ease;
      animation: remPulse 1.2s ease-in-out infinite;
    }
    .reminder-overlay.show .reminder-card {
      transform: scale(1) translateY(0);
    }
    @keyframes remPulse {
      0%, 100% { box-shadow: 0 24px 60px rgba(140, 80, 100, 0.3), 0 0 0 0 rgba(224, 154, 170, 0.45); }
      50% { box-shadow: 0 24px 60px rgba(140, 80, 100, 0.35), 0 0 0 14px rgba(224, 154, 170, 0); }
    }
    .reminder-card .rc-bell {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: remShake 0.55s ease-in-out 3;
    }
    @keyframes remShake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-14deg); }
      75% { transform: rotate(14deg); }
    }
    .reminder-card .rc-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-deep);
      margin-bottom: 8px;
    }
    .reminder-card .rc-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      word-break: break-word;
    }
    .reminder-card .rc-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .reminder-card .rc-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .reminder-card .rc-actions .btn { flex: 1; min-height: 48px; }

    .modal {
      background: rgba(255, 250, 252, 0.88);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-radius: 24px 24px 0 0;
      padding: 24px 18px calc(24px + var(--safe-bottom));
      width: 100%;
      max-width: 440px;
      box-shadow: 0 -8px 40px rgba(140, 80, 100, 0.18);
      border: 1px solid rgba(255,255,255,0.7);
      border-bottom: none;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @media (min-width: 520px) {
      .modal {
        border-radius: 26px;
        padding: 28px;
        border-bottom: 1px solid rgba(255,255,255,0.7);
        animation: fadeIn 0.25s ease;
      }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal h2 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: var(--text);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 5px;
      color: var(--muted);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-end;
    }
    .modal-actions .btn { flex: 1; }
    @media (min-width: 520px) {
      .modal-actions .btn { flex: none; }
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .reminder-badge {
      display: inline-block;
      background: rgba(224, 154, 170, 0.28);
      color: var(--accent-deep);
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 4px;
    }
    .upcoming { max-height: 240px; overflow-y: auto; }
    .upcoming-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(200, 120, 140, 0.1);
      font-size: 0.88rem;
      cursor: pointer;
    }
    .upcoming-item:last-child { border-bottom: none; }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 12px;
    }
    .filter-chip {
      border: 1px solid rgba(200, 120, 140, 0.25);
      background: rgba(255,255,255,0.4);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 32px;
      font-family: inherit;
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #e09aaa, #d08098);
      color: #fff;
      border-color: transparent;
    }
    .backup-panel { padding: 4px 0; }
    .backup-intro {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .backup-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 8px;
      min-height: 1.2em;
    }

    .main-views.hidden { display: none; }

    /* ===== MOBILE BOTTOM NAV + FAB ===== */
    .fab {
      position: fixed;
      bottom: calc(72px + var(--safe-bottom));
      right: 16px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e09aaa, #d08098);
      color: #fff;
      border: none;
      font-size: 1.6rem;
      box-shadow: 0 6px 24px rgba(200, 120, 140, 0.45);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }

    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 248, 250, 0.85);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      padding: 8px 8px calc(8px + var(--safe-bottom));
      z-index: 40;
      box-shadow: 0 -4px 24px rgba(160, 90, 110, 0.1);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s;
      min-width: 64px;
    }
    .nav-item .icon { font-size: 1.25rem; line-height: 1; }
    .nav-item.active {
      color: var(--accent-deep);
      background: rgba(224, 154, 170, 0.15);
    }

    /* Hide desktop sidebar buttons on mobile */
    .desktop-only { display: none; }
    @media (min-width: 820px) {
      .desktop-only { display: block; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="hearts" id="hearts"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="app">
    <header>
      <h1>🍀 Diár</h1>
      <div class="view-switcher" id="viewSwitcher">
        <button class="view-btn active" data-view="month">Mesiac</button>
        <button class="view-btn" data-view="week">Týždeň</button>
        <button class="view-btn" data-view="list">Záloha</button>
        <button class="view-btn" data-view="notes">Poznámky</button>
      </div>
    </header>

    <!-- Mobile category chips -->
    <div class="categories-mobile" id="mobileCats"></div>

    <!-- ===== MAIN VIEWS ===== -->
    <div class="main main-views" id="mainViews">
      <div class="sidebar sidebar-desktop">
        <div class="card">
          <h3>Kategórie</h3>
          <div class="category-list" id="categoryList"></div>
          <button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="openCategoryModal()">
            + Pridať kategóriu
          </button>
        </div>
        <div class="card">
          <h3>Nadchádzajúce pripomienky</h3>
          <div class="filter-chips" id="reminderFilters">
            <button type="button" class="filter-chip active" data-filter="all" onclick="setReminderFilter('all')">Všetky</button>
            <button type="button" class="filter-chip" data-filter="today" onclick="setReminderFilter('today')">Dnes</button>
            <button type="button" class="filter-chip" data-filter="week" onclick="setReminderFilter('week')">Týždeň</button>
            <button type="button" class="filter-chip" data-filter="later" onclick="setReminderFilter('later')">Neskôr</button>
          </div>
          <div class="filter-chips" id="reminderCatFilters"></div>
          <div class="upcoming" id="upcomingList">
            <div class="empty-state" style="padding:12px">Žiadne pripomienky</div>
          </div>
        </div>
        <button class="btn btn-primary desktop-only" style="width:100%" onclick="openTaskModal()">
          + Nová úloha
        </button>
      </div>

      <div class="card">
        <div class="calendar-header">
          <h2 id="periodTitle">September 2026</h2>
          <div class="nav-btns">
            <button class="btn btn-ghost" onclick="changePeriod(-1)">◀</button>
            <button class="btn btn-ghost" onclick="goToday()">Dnes</button>
            <button class="btn btn-ghost" onclick="changePeriod(1)">▶</button>
          </div>
        </div>
        <div id="monthView">
          <div class="calendar-grid" id="calendarGrid"></div>
          <div class="day-detail" id="dayDetail" style="display:none">
            <div class="day-detail-header">
              <div>
                <div class="day-detail-title" id="dayDetailTitle">Deň</div>
                <div class="day-detail-meniny" id="dayDetailMeniny"></div>
              </div>
              <button class="btn btn-ghost" onclick="closeDayDetail()" style="min-width:auto;padding:8px 12px">✕</button>
            </div>
            <div class="task-list" id="dayDetailTasks"></div>
            <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="openTaskModal(state.selectedDate)">+ Pridať úlohu na tento deň</button>
          </div>
        </div>
        <div id="weekView" style="display:none">
          <div class="week-grid" id="weekGrid"></div>
        </div>
        <div id="listView" style="display:none">
          <div class="backup-panel">
            <p class="backup-intro">Exportuj všetky úlohy a pripomienky do Excelu (CSV). Na inom mobile ich znova naimportuj.</p>
            <button type="button" class="btn btn-primary" style="width:100%;margin-bottom:12px" onclick="exportToExcel()">
              📤 Export do Excelu
            </button>
            <label class="btn btn-secondary" style="width:100%;margin-bottom:12px;display:flex;align-items:center;justify-content:center;cursor:pointer">
              📥 Import z Excelu
              <input type="file" id="importFile" accept=".csv,.txt,text/csv" style="display:none" onchange="importFromExcel(event)">
            </label>
            <p class="backup-hint" id="backupStatus"></p>
          </div>
        </div>
        <div id="notesView" style="display:none">
          <div class="notes-toolbar">
            <button class="btn btn-primary" onclick="addNoteBlock()">+ Nový blok</button>
            <span class="notes-meta" id="notesMeta">Uložené</span>
          </div>
          <div id="notesBlocks"></div>
        </div>
      </div>
    </div>

    <!-- ===== CATEGORY DETAIL PAGE ===== -->
    <div class="category-page" id="categoryPage">
      <button class="btn btn-back" onclick="closeCategoryPage()">← Späť</button>
      <div class="card">
        <div class="category-page-header">
          <div>
            <div class="category-page-title">
              <span class="category-page-dot" id="catPageDot"></span>
              <span id="catPageName">Kategória</span>
            </div>

          </div>
        </div>

        </div>
        <div class="task-list" id="catPageTasks"></div>
      </div>
    </div>
  </div>

  <!-- FAB (mobile) -->
  <button class="fab" id="fab" onclick="openTaskModal()" title="Nová úloha">+</button>

  <!-- Mobile bottom nav -->
  <nav class="mobile-nav" id="mobileNav">
    <button class="nav-item active" data-view="month" onclick="setView('month')">

      <span>Mesiac</span>
    </button>

      <span>Týždeň</span>

      <span class="icon">💾</span>
      <span>Záloha</span>
    </button>
    <button class="nav-item" data-view="notes" onclick="setView('notes')">
      <span class="icon">📝</span>
      <span>Poznámky</span>
    </button>
  </nav>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="taskModalTitle">Nová úloha</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">

          <label>Názov úlohy</label>
          <input type="text" id="taskTitle" required placeholder="Napr. Cvičenie, Stretnutie...">
        </div>
        <div class="form-group">
          <label>Popis (voliteľné)</label>
          <textarea id="taskDesc" rows="2" placeholder="Detaily..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Dátum</label>
            <input type="date" id="taskDate" required>
          </div>
          <div class="form-group">
            <label>Čas</label>
            <input type="time" id="taskTime">
          </div>
        </div>
        <div class="form-group">
          <label>Kategória</label>
          <select id="taskCategory" required></select>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px">

          </label>
        </div>
        <div class="form-group" id="reminderTimeGroup" style="display:none">
          <label>Pripomenúť o</label>
          <input type="datetime-local" id="reminderTime">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeTaskModal()">Zrušiť</button>
          <button type="submit" class="btn btn-primary">Uložiť</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category Modal -->

      <h2>Nová kategória</h2>

          <label>Názov</label>

    function loadData() {
      const cats = localStorage.getItem('zlatkoDiary_cats');
      const tasks = localStorage.getItem('zlatkoDiary_tasks');
      state.categories = cats ? JSON.parse(cats) : [
        { id: '1', name: 'Práca', color: '#a8c8e0' },
        { id: '2', name: 'Osobné', color: '#e09aaa' },
        { id: '3', name: 'Zdravie', color: '#b8d8c8' }
      ];
      state.tasks = tasks ? JSON.parse(tasks) : [];
      // Notes: migrate old single string → blocks
      const rawNotes = localStorage.getItem('zlatkoDiary_notes');
      try {
        const parsed = rawNotes ? JSON.parse(rawNotes) : null;
        if (Array.isArray(parsed)) {
          state.notes = parsed;
        } else if (typeof rawNotes === 'string' && rawNotes && rawNotes[0] !== '[') {
          state.notes = [{ id: 'n1', title: 'Poznámky', body: rawNotes }];
        } else {
          state.notes = parsed && parsed.length ? parsed : [{ id: 'n1', title: 'Všeobecné', body: '' }];
        }
      } catch {
        state.notes = rawNotes
          ? [{ id: 'n1', title: 'Poznámky', body: rawNotes }]
          : [{ id: 'n1', title: 'Všeobecné', body: '' }];
      }
      if (!state.notes.length) state.notes = [{ id: 'n1', title: 'Všeobecné', body: '' }];
      saveData();
      saveNotes();
    }

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function parseDate(str) {
      const [y,m,d] = str.split('-').map(Number);
      return new Date(y, m-1, d);
    }
    function getMonthName(date) {
      return date.toLocaleDateString('sk-SK', { month: 'long', year: 'numeric' });
    }
    function getWeekRange(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diff);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { monday, sunday };
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    }

    function renderMonth() {
      const grid = document.getElementById('calendarGrid');
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();
      document.getElementById('periodTitle').textContent = getMonthName(state.currentDate);

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      let startDay = firstDay.getDay();
      startDay = startDay === 0 ? 6 : startDay - 1;

      const days = ['Po','Ut','St','Št','Pi','So','Ne'];
      let html = days.map(d => `<div class="day-name">${d}</div>`).join('');

      const prevLast = new Date(year, month, 0).getDate();
      for (let i = startDay - 1; i >= 0; i--) {
        html += `<div class="day-cell other-month"><span class="day-number">${prevLast - i}</span></div>`;
      }

      const todayStr = formatDate(new Date());
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dateStr === todayStr;
        const isSelected = state.selectedDate === dateStr;
        const dayTasks = state.tasks.filter(t => t.date === dateStr && !t.done);

        let classes = 'day-cell';
        if (isToday) classes += ' today';
        if (isSelected) classes += ' selected';

        const dots = dayTasks.slice(0,3).map(t => {
          const cat = state.categories.find(c => c.id === t.categoryId);
          return `<div class="dot" style="background:${cat ? cat.color : '#ccc'}"></div>`;
        }).join('');

        html += `
          <div class="${classes}" onclick="selectDate('${dateStr}')">
            <span class="day-number">${d}</span>
            <div class="day-dots">${dots}</div>
          </div>
        `;
      }

      const total = startDay + lastDay.getDate();
      const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
      for (let i = 1; i <= remaining; i++) {
        html += `<div class="day-cell other-month"><span class="day-number">${i}</span></div>`;
      }
      grid.innerHTML = html;
    }

    function csvEscape(val) {
      const s = String(val == null ? '' : val);
      if (/[;"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function exportToExcel() {
      const headers = ['nazov','popis','datum','cas','kategoria','pripomienka','cas_pripomienky','hotovo'];
      const rows = state.tasks.map(t => {
        const cat = state.categories.find(c => c.id === t.categoryId);
        return [
          t.title || '',
          t.desc || '',
          t.date || '',
          t.time || '',
          cat ? cat.name : '',
          t.reminder ? 'ano' : 'nie',
          t.reminderTime || '',
          t.done ? 'ano' : 'nie'
        ].map(csvEscape).join(';');
      });
      const bom = '\uFEFF';
      const csv = bom + headers.join(';') + '\n' + rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `diar-zaloha-${stamp}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      const st = document.getElementById('backupStatus');
      if (st) {
        st.textContent = `Exportované ${state.tasks.length} úloh. Súbor otvoríš v Exceli.`;
        st.dataset.keep = '1';
      }
    }

    function importFromExcel(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          let text = String(reader.result || '');
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          if (lines.length < 2) throw new Error('Prázdny súbor');

          const sep = lines[0].includes(';') ? ';' : ',';
          const splitLine = (line) => {
            const out = [];
            let cur = '', inQ = false;
            for (let i = 0; i < line.length; i++) {
              const ch = line[i];
              if (ch === '"') {
                if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
                else inQ = !inQ;
              } else if (ch === sep && !inQ) {
                out.push(cur); cur = '';
              } else cur += ch;
            }
            out.push(cur);
            return out;
          };

          const header = splitLine(lines[0]).map(h => h.trim().toLowerCase());
          const idx = (names) => {
            for (const n of names) {
              const i = header.indexOf(n);
              if (i >= 0) return i;
            }
            return -1;
          };
          const iTitle = idx(['nazov', 'názov', 'title']);
          const iDesc = idx(['popis', 'desc', 'description']);
          const iDate = idx(['datum', 'dátum', 'date']);
          const iTime = idx(['cas', 'čas', 'time']);
          const iCat = idx(['kategoria', 'kategória', 'category']);
          const iRem = idx(['pripomienka', 'reminder']);
          const iRemT = idx(['cas_pripomienky', 'čas_pripomienky', 'remindertime']);
          const iDone = idx(['hotovo', 'done']);

          if (iTitle < 0 || iDate < 0) throw new Error('Chýbajú stĺpce nazov a datum');

          let added = 0;
          for (let r = 1; r < lines.length; r++) {
            const cols = splitLine(lines[r]);
            const title = (cols[iTitle] || '').trim();
            const date = (cols[iDate] || '').trim();
            if (!title || !date) continue;

            let catName = iCat >= 0 ? (cols[iCat] || '').trim() : '';
            let cat = state.categories.find(c => c.name.toLowerCase() === catName.toLowerCase());
            if (!cat && catName) {
              cat = { id: 'c' + Date.now() + r, name: catName, color: PASTEL_COLORS[state.categories.length % PASTEL_COLORS.length] };
              state.categories.push(cat);
            }
            if (!cat) cat = state.categories[0];

            const yes = (v) => /^(ano|áno|yes|true|1)$/i.test((v || '').trim());
            state.tasks.push({
              id: 't' + Date.now() + r,
              title,
              desc: iDesc >= 0 ? (cols[iDesc] || '') : '',
              date,
              time: iTime >= 0 ? (cols[iTime] || '') : '',
              categoryId: cat.id,
              reminder: iRem >= 0 ? yes(cols[iRem]) : false,
              reminderTime: iRemT >= 0 ? (cols[iRemT] || '') : '',
              done: iDone >= 0 ? yes(cols[iDone]) : false,
              notified: false
            });
            added++;
          }
          saveData();
          render();
          const st = document.getElementById('backupStatus');
          if (st) {
            st.textContent = `Importované ${added} úloh.`;
            st.dataset.keep = '1';
          }
        } catch (err) {
          const st = document.getElementById('backupStatus');
          if (st) {
            st.textContent = 'Import zlyhal: ' + (err.message || 'neplatný súbor');
            st.dataset.keep = '1';
          }
        }
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    }

      }

      let upcoming = state.tasks
        .filter(t => t.reminder && t.reminderTime && !t.done)
        .filter(t => new Date(t.reminderTime) > now);

      if (state.reminderCatFilter) {
        upcoming = upcoming.filter(t => t.categoryId === state.reminderCatFilter);
      }

      upcoming = upcoming.filter(t => {
        const rem = new Date(t.reminderTime);
        if (state.reminderFilter === 'today') return rem >= startOfToday && rem < endOfToday;
        if (state.reminderFilter === 'week') return rem >= startOfToday && rem < endOfWeek;
        if (state.reminderFilter === 'later') return rem >= endOfWeek;
        return true; // all
      });

      upcoming.sort((a, b) => new Date(a.reminderTime) - new Date(b.reminderTime));

      if (upcoming.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:12px">Žiadne pripomienky v tomto filtri</div>';
        return;
      }
      list.innerHTML = upcoming.map(t => {
        const cat = state.categories.find(c => c.id === t.categoryId);
        const rem = new Date(t.reminderTime);
        return `
          <div class="upcoming-item" onclick="editTask('${t.id}')">
            <div style="font-weight:600">${t.title}</div>
            <div style="color:var(--muted);font-size:0.78rem;margin-top:2px">
              ${rem.toLocaleString('sk-SK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
              · <span style="color:${cat ? cat.color : '#999'}">${cat ? cat.name : ''}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== VIEW =====
    function setView(view) {
      state.currentView = view;
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      document.getElementById('monthView').style.display = view === 'month' ? 'block' : 'none';
      document.getElementById('weekView').style.display = view === 'week' ? 'block' : 'none';
      document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
      document.getElementById('notesView').style.display = view === 'notes' ? 'block' : 'none';
      // Hide nav arrows on notes
      document.querySelector('.nav-btns').style.display = (view === 'notes' || view === 'list') ? 'none' : 'flex';
      render();
    }
    function changePeriod(dir) {
      if (state.currentView === 'month') state.currentDate.setMonth(state.currentDate.getMonth() + dir);
      else if (state.currentView === 'week') state.currentDate.setDate(state.currentDate.getDate() + dir * 7);
      render();
    }
    function goToday() {
      state.currentDate = new Date();
      state.selectedDate = formatDate(new Date());
      render();
    }
    function selectDate(dateStr) {
      state.selectedDate = dateStr;
      if (state.currentView === 'month') {
        renderMonth();
        renderDayDetail(dateStr);
      } else {
        openTaskModal(dateStr);
      }
    }
    function closeDayDetail() {
      state.selectedDate = null;
      const el = document.getElementById('dayDetail');
      if (el) el.style.display = 'none';
      if (state.currentView === 'month') renderMonth();
    }
    function renderDayDetail(dateStr) {
      const el = document.getElementById('dayDetail');
      if (!el) return;
      el.style.display = 'block';
      const d = parseDate(dateStr);
      const title = d.toLocaleDateString('sk-SK', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('dayDetailTitle').textContent = title.charAt(0).toUpperCase() + title.slice(1);
      const meniny = getMeniny(dateStr);
      document.getElementById('dayDetailMeniny').innerHTML = meniny
        ? `<span class="meniny-icon">💐</span> Meniny: <strong>${meniny}</strong>`
        : '';

      const list = document.getElementById('dayDetailTasks');
      const dayTasks = state.tasks
        .filter(t => t.date === dateStr)
        .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      if (!dayTasks.length) {
        list.innerHTML = '<div class="empty-state" style="padding:16px">Na tento deň zatiaľ nemáš žiadne úlohy ani pripomienky.</div>';
        return;
      }
      list.innerHTML = dayTasks.map(t => {
        const cat = state.categories.find(c => c.id === t.categoryId);
        return `
          <div class="task-item ${t.done ? 'done' : ''}">
            <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone('${t.id}')">${t.done ? '✓' : ''}</div>
            <div class="task-body" onclick="editTask('${t.id}')">
              <div class="task-title">${t.title}</div>
              <div class="task-meta">
                ${t.time ? t.time + ' · ' : ''}
                ${cat ? cat.name : ''}
                ${t.reminder ? ' · 🔔' : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="icon-btn" onclick="editTask('${t.id}')">✏️</button>
              <button class="icon-btn" onclick="deleteTask('${t.id}')">🗑</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== MODALS =====
    function openTaskModal(prefillDate = null, taskId = null, forceCategoryId = null) {
      document.getElementById('taskForm').reset();
      document.getElementById('taskId').value = '';
      document.getElementById('reminderTimeGroup').style.display = 'none';

      if (taskId) {
        const t = state.tasks.find(x => x.id === taskId);
        if (!t) return;
        document.getElementById('taskModalTitle').textContent = 'Upraviť úlohu';
        document.getElementById('taskId').value = t.id;
        document.getElementById('taskTitle').value = t.title;
        document.getElementById('taskDesc').value = t.desc || '';
        document.getElementById('taskDate').value = t.date;
        document.getElementById('taskTime').value = t.time || '';
        document.getElementById('taskCategory').value = t.categoryId;
        document.getElementById('taskReminder').checked = !!t.reminder;
        if (t.reminder && t.reminderTime) {
          document.getElementById('reminderTimeGroup').style.display = 'block';
          document.getElementById('reminderTime').value = t.reminderTime.slice(0,16);
        }
      } else {
        document.getElementById('taskModalTitle').textContent = 'Nová úloha';
        document.getElementById('taskDate').value = prefillDate || formatDate(new Date());
        if (forceCategoryId) document.getElementById('taskCategory').value = forceCategoryId;
      }
      document.getElementById('taskModal').classList.add('open');
    }
    function closeTaskModal() {
      document.getElementById('taskModal').classList.remove('open');
    }
    function editTask(id) { openTaskModal(null, id); }

    function openCategoryModal() {
      document.getElementById('categoryForm').reset();
      state.selectedColor = PASTEL_COLORS[0];
      renderColorPicker();
      document.getElementById('categoryModal').classList.add('open');
    }
    function closeCategoryModal() {
      document.getElementById('categoryModal').classList.remove('open');
    }
    function renderColorPicker() {
      document.getElementById('colorPicker').innerHTML = PASTEL_COLORS.map(c => `
        <div class="color-option ${c === state.selectedColor ? 'selected' : ''}"
             style="background:${c}"
             onclick="state.selectedColor='${c}';renderColorPicker()"></div>
      `).join('');
    }

    // ===== ACTIONS =====
    function toggleDone(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.done = !t.done;
        saveData();
        if (state.openCategoryId) renderCategoryPage();
        else render();
      }
    }
    let confirmCallback = null;

    function openConfirmModal(title, message, onConfirm, icon = '⚠️') {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmIcon').textContent = icon;
      document.getElementById('confirmOkBtn').textContent = 'Vymazať';
      confirmCallback = onConfirm;
      document.getElementById('confirmModal').classList.add('open');
    }
    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.remove('open');
      confirmCallback = null;
      document.getElementById('confirmOkBtn').textContent = 'Vymazať';
    }
    document.getElementById('confirmOkBtn').addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      closeConfirmModal();
    });

    function deleteTask(id) {
      openConfirmModal(
        'Vymazať úlohu?',
        'Táto úloha sa natrvalo odstráni. Túto akciu nemôžeš vrátiť späť.',
        () => {
          state.tasks = state.tasks.filter(t => t.id !== id);
          saveData();
          if (state.openCategoryId) renderCategoryPage();
          else render();
        },
        '🗑'
      );
    }
    function deleteCategory(id) {
      if (state.tasks.some(t => t.categoryId === id)) {
        openConfirmModal(
          'Kategóriu nemožno zmazať',
          'Táto kategória sa stále používa v úlohách. Najprv úlohy zmeň alebo zmaž, potom môžeš kategóriu odstrániť.',
          () => {},
          '🔒'
        );
        setTimeout(() => {
          document.getElementById('confirmOkBtn').textContent = 'Rozumiem';
        }, 0);
        return;
      }
      const cat = state.categories.find(c => c.id === id);
      document.getElementById('confirmOkBtn').textContent = 'Vymazať';
      openConfirmModal(
        'Vymazať kategóriu?',
        `Naozaj chceš zmazať kategóriu „${cat ? cat.name : ''}“? Túto akciu nemôžeš vrátiť späť.`,
        () => {
          state.categories = state.categories.filter(c => c.id !== id);
          saveData();
          if (state.openCategoryId === id) {
            closeCategoryPage();
          } else {
            render();
          }
        },
        '🗑'
      );
    }
    function deleteCategoryFromPage() {
      if (!state.openCategoryId) return;
      deleteCategory(state.openCategoryId);
    }

    // ===== FORMS =====
    document.getElementById('taskForm').addEventListener('submit', e => {
      e.preventDefault();
      const id = document.getElementById('taskId').value;
      const data = {
        title: document.getElementById('taskTitle').value.trim(),
        desc: document.getElementById('taskDesc').value.trim(),
        date: document.getElementById('taskDate').value,
        time: document.getElementById('taskTime').value,
        categoryId: document.getElementById('taskCategory').value,
        reminder: document.getElementById('taskReminder').checked,
        reminderTime: document.getElementById('taskReminder').checked
          ? document.getElementById('reminderTime').value : null,
        done: false
      };
      if (id) {
        const t = state.tasks.find(x => x.id === id);
        Object.assign(t, data);
      } else {
        data.id = uid();
        state.tasks.push(data);
      }
      saveData();
      closeTaskModal();
      if (state.openCategoryId) renderCategoryPage();
      else render();
      requestNotificationPermission();
    });

    document.getElementById('categoryForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('catName').value.trim();
      if (!name) return;
      state.categories.push({ id: uid(), name, color: state.selectedColor });
      saveData();
      closeCategoryModal();
      render();
    });

    document.getElementById('taskReminder').addEventListener('change', e => {
      document.getElementById('reminderTimeGroup').style.display = e.target.checked ? 'block' : 'none';
      if (e.target.checked && !document.getElementById('reminderTime').value) {
        const date = document.getElementById('taskDate').value;
        const time = document.getElementById('taskTime').value || '09:00';
        document.getElementById('reminderTime').value = `${date}T${time}`;
      }
    });

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target === el) el.classList.remove('open');
      });
    });

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // Soft two-tone chime via Web Audio (no external file)
    function playReminderSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99]; // C5 E5 G5
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.02 + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45 + i * 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + 0.5 + i * 0.12);
        });
        setTimeout(() => ctx.close(), 1500);
      } catch (e) { /* ignore */ }
    }

    let _activeReminderTaskId = null;

    function showReminderAlert(task) {
      _activeReminderTaskId = task.id;
      document.getElementById('rcTitle').textContent = task.title || 'Pripomienka';
      const timeStr = task.time || '';
      document.getElementById('rcSub').textContent = timeStr
        ? `Nastavený čas: ${timeStr}`
        : 'Čas tvojej úlohy práve nastal';
      document.getElementById('reminderOverlay').classList.add('show');
      document.getElementById('rcDoneBtn').onclick = () => {
        if (_activeReminderTaskId) toggleDone(_activeReminderTaskId);
        hideReminderAlert();
      };
    }
    function hideReminderAlert() {
      document.getElementById('reminderOverlay').classList.remove('show');
      _activeReminderTaskId = null;
    }

    function fireReminder(task) {
      playReminderSound();
      if (navigator.vibrate) navigator.vibrate([140, 70, 140, 70, 200]);
      showReminderAlert(task);
      // Blink tab title
      const orig = document.title;
      let n = 0;
      const blink = setInterval(() => {
        document.title = (n % 2 === 0) ? '🔔 Pripomienka!' : orig;
        if (++n > 10) { clearInterval(blink); document.title = orig; }
      }, 500);
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('Pripomienka – Diár', {
            body: task.title,
            icon: './icon-192.png',
            tag: 'diar-' + task.id
          });
        } catch (e) { /* ignore */ }
      }
    }

    function checkReminders() {
      const now = new Date();
      let changed = false;
      state.tasks.forEach(t => {
        if (t.reminder && t.reminderTime && !t.done && !t.notified) {
          const rem = new Date(t.reminderTime);
          // trigger within last 90 seconds of due time
          if (rem <= now && rem > new Date(now - 90000)) {
            fireReminder(t);
            t.notified = true;
            changed = true;
          }
        }
      });
      if (changed) {
        saveData();
        renderUpcoming();
      }
    }

    function render() {
      renderCategories();
      if (state.currentView === 'month') {
        renderMonth();
        if (state.selectedDate) renderDayDetail(state.selectedDate);
      } else if (state.currentView === 'week') renderWeek();
      else if (state.currentView === 'list') renderList();
      else if (state.currentView === 'notes') renderNotes();
      renderUpcoming();
    }

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    // Floating hearts
    (function spawnHearts() {
      const container = document.getElementById('hearts');
      if (!container) return;
      const hearts = ['♥', '♡', '❤', '💕'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.className = 'heart' + (i % 3 === 0 ? ' soft' : '') + (i % 4 === 0 ? ' big' : '') + (i % 5 === 0 ? ' tiny' : '');
        el.textContent = hearts[i % hearts.length];
        el.style.left = Math.random() * 100 + '%';
        el.style.bottom = '-' + (Math.random() * 20) + '%';
        el.style.animationDuration = (12 + Math.random() * 16) + 's';
        el.style.animationDelay = (Math.random() * 14) + 's';
        container.appendChild(el);
      }
    })();

    loadData();
    render();
    requestNotificationPermission();
    setInterval(checkReminders, 10000);
    // Also check when tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkReminders();
    });
    // Unlock audio after first tap (browser policy)
    document.addEventListener('click', function unlockAudioOnce() {
      try {
        const c = new (window.AudioContext || window.webkitAudioContext)();
        c.resume().then(() => c.close());
      } catch (e) {}
      document.removeEventListener('click', unlockAudioOnce);
    }, { once: true });

    // Service Worker (PWA) – offline cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // ===== OneSignal push (optional) =====
    // 1. Vytvor účet na https://onesignal.com (zdarma)
    // 2. New App → Web
    // 3. Site URL = tvoja GitHub Pages adresa (https://...)
    // 4. Skopíruj App ID sem:
    const ONESIGNAL_APP_ID = ''; // napr. 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'

    if (ONESIGNAL_APP_ID) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          serviceWorkerPath: 'OneSignalSDKWorker.js',
          serviceWorkerParam: { scope: '/' },
          notifyButton: { enable: false },
          promptOptions: {
            slidedown: {
              prompts: [{
                type: 'push',
                autoPrompt: true,
                text: {
                  actionMessage: 'Chceš dostávať pripomienky z Diára aj keď je appka zatvorená?',
                  acceptButton: 'Áno, povoliť',
                  cancelButton: 'Teraz nie'
                }
              }]
            }
          }
        });
      });
    }
  </script>
</body>
